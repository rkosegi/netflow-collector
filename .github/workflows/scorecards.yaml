---
name: Scorecard supply-chain security
on:
  branch_protection_rule:
  schedule:
    - cron: 32 22 * * 4
  push:
    branches:
      - main
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    permissions:
      security-events: write
      id-token: write
    uses: rkosegi/github-workflows/.github/workflows/ossf.yaml@9c2fa7903f12c13f9d0d391583de72f671bc8d9a # v0.0.13
