---
name: CodeQL Advanced
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: 36 2 * * 4
permissions:
  contents: read

jobs:
  analyze:
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: rkosegi/github-workflows/.github/workflows/go-codeql.yaml@38c3dff5db0c47194f39855be3236efd2713af59 # v0.0.10
